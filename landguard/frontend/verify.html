<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>LANDGUARD — Verify</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="" />
  </head>
  <body>
    <div id="nav"></div>

    <div class="page">
      <div class="page-header">
        <div>
          <div class="breadcrumb">Search</div>
          <h1>Find a parcel</h1>
          <p>Search by parcel ID, district, or upazila. Select a result to open its Land Passport.</p>
        </div>
      </div>

      <section class="section">
        <h2>Search</h2>
        <p class="subtle">All fields are optional. Combinations narrow the result.</p>
        <form id="searchForm" class="search-bar" autocomplete="off">
          <div class="field">
            <label>Parcel ID</label>
            <input class="input" id="q-id" placeholder="LG-BD-DHK-SAV-000001" />
          </div>
          <div class="field">
            <label>District</label>
            <input class="input" id="q-district" placeholder="e.g. Dhaka" />
          </div>
          <div class="field">
            <label>Upazila</label>
            <input class="input" id="q-upazila" placeholder="e.g. Savar" />
          </div>
          <button class="btn" type="submit">Search</button>
          <button class="btn secondary" type="button" id="clearBtn">Clear</button>
        </form>
      </section>

      <section class="section" style="margin-top:16px;">
        <div class="row between">
          <h2 style="margin-bottom:0;">Results <span class="muted" id="resultCount"></span></h2>
          <a class="btn secondary" href="dashboard.html">Back to Dashboard</a>
        </div>
        <div id="results" style="margin-top:14px;"></div>
      </section>

      <section class="section" style="margin-top:16px;">
        <h2>Map preview</h2>
        <p class="subtle">Synthetic demo geometry. Click polygons to open Land Passports.</p>
        <div id="map" class="map" style="height:380px;"></div>
      </section>
    </div>

    <script src="js/layout.js"></script>
    <script src="js/api.js"></script>
    <script src="js/map.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <script src="js/verify.js"></script>
    <script>
      LandGuardLayout.el("nav").innerHTML = LandGuardLayout.render("verify");
      LandGuardVerify.boot();
    </script>
    <script src="js/fx.js"></script>
  </body>
</html>
